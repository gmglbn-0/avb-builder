version: "3.8"

services:
  avb-builder:
    build: .
    image: avb-builder:latest
    container_name: avb-builder
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - /data/avb-builder:/data
    environment:
      - AVB_DATA_DIR=/data
      - AVB_PORT=8085
      - AVB_HOST=0.0.0.0
      - AVB_BASE_URL=http://100.64.0.131:8085
      # Optional private key passphrases if your keys are encrypted:
      # - PASSPHRASE_AVB=your_passphrase_here
      # - PASSPHRASE_OTA=your_passphrase_here
